<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador de Mesa | Mesas Para Juegos</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <script defer src="../assets/js/componentes.js"></script>
    <script defer src="../assets/js/configurador.js"></script>
</head>
<body>
    <header id="header"></header>

    <main class="config-main">
        <nav class="breadcrumbs">
            <a href="../index.html">Inicio</a> &gt;
            <span>Configurador</span>
        </nav>

        <section class="titulo-pagina">
            <span class="eyebrow">Configurador</span>
            <h1 id="titulo-mesa">Configurando tu mesa</h1>
            <p>Selecciona materiales, acabados y extras para preparar una solicitud de presupuesto.</p>
        </section>

        <nav class="pasos" aria-label="Pasos del configurador">
            <span class="paso activo">Material</span>
            <span class="paso">Color</span>
            <span class="paso">Tapete</span>
            <span class="paso">Cajon</span>
            <span class="paso">Lamina</span>
            <span class="paso">LEDs</span>
            <span class="paso">Cierre magnetico</span>
        </nav>

        <section class="config-layout">
            <div class="config-3d" id="vista-3d"></div>

            <div class="config-opciones">
                <h2 id="titulo-paso">Material</h2>
                <div id="opciones"></div>
                <button id="btn-siguiente" class="btn-primary">Siguiente</button>
            </div>
        </section>
    </main>

    <footer id="footer"></footer>
</body>
</html>
